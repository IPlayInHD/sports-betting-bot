[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbbot"
version = "0.1.0"
description = "Multi-layer arbitrage/value-edge detection bot between sportsbook odds markets and Polymarket"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-dateutil>=2.8",
    "rapidfuzz>=3.6",
    "tenacity>=8.2",
    "orjson>=3.9",
]

[project.optional-dependencies]
live = [
    "py-clob-client>=0.19.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "freezegun>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
