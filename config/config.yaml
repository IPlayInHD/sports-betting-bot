# Default configuration - deliberately conservative.
# Paper trading is the default; live trading requires explicit multi-step opt-in
# (see README "Safety & going live").

mode: paper  # paper | backtest | live

# Win-rate-first switch. true = ONLY the riskless arbitrage layers run
# (sports arb, crypto cross-exchange, Polymarket YES+NO complement) -- every
# one wins by construction once both legs fill. The directional model layers
# (sports value_edge, polycrypto spot_anchor) are forced off no matter what
# their own enabled flags say. Set false to also run those higher-variance
# statistical layers (higher potential edge, real chance of a losing trade).
conservative_mode: true

polling:
  odds_poll_interval_sec: 2.0
  polymarket_poll_interval_sec: 1.0
  max_quote_age_sec: 3.0        # Layer 6 staleness filter
  # Adaptive burst polling: when a cycle detects an opportunity, that market's
  # loop immediately drops to burst_interval_sec (gaps cluster in time), then
  # decays geometrically back up to its base interval across quiet cycles.
  burst_interval_sec: 0.4
  burst_decay: 1.6

sports:
  - basketball_nba
  - americanfootball_nfl
  - soccer_epl
  - baseball_mlb

matching:
  min_match_score: 0.82        # rapidfuzz similarity threshold for team/market matching
  max_date_skew_hours: 6

strategy:
  arbitrage:
    enabled: true
    min_edge_pct: 0.5           # keep gaps LOW -> more frequent, lower-risk hits
    max_edge_pct: 8.0           # above this, treat as a data error and skip
  value_edge:
    enabled: false              # secondary, higher-variance layer - opt in explicitly
    min_books_agreeing: 3
    min_edge_pct: 3.0
    kelly_fraction: 0.15

filters:
  min_polymarket_liquidity_usd: 500
  max_spread_pct: 3.0
  max_signal_latency_ms: 800
  max_concurrent_positions_per_market_group: 1  # correlation guard

risk:
  bankroll_usd: 100            # observation-mode starting capital (paper $ only until you go live)
  max_stake_per_trade_pct: 2.0
  max_stake_per_trade_usd: 50
  min_stake_usd: 1.0            # skip trades sized below venue minimums (Polymarket ~ $1)
  max_total_exposure_pct: 25
  max_daily_loss_pct: 5
  max_consecutive_losses: 5
  fee_buffer_pct: 1.0           # subtracted from edge to account for Polymarket taker fee + book vig slack

execution:
  paper_slippage_bps: 15
  order_timeout_sec: 5
  max_retries: 2

monitoring:
  log_level: INFO
  metrics_window_size: 200

markets:
  crypto:
    enabled: true
    observation_only: true     # DETECT + log cross-exchange gaps but don't trade them
                               # (latency race + needs pre-funded multi-exchange balances).
                               # Set false to paper-trade this desk.
    exchanges: [coinbase, kraken, binanceus]   # use "binance" instead of "binanceus" outside the US
    # PAXG/USD is PAX Gold -- a token redeemable for 1 oz of gold. It tracks
    # the gold price (low volatility, stable trend) and trades cross-exchange,
    # so it slots straight into the riskless buy-low/sell-high engine as a
    # calmer, higher-win-rate book alongside the crypto majors. (Not all
    # exchanges list every symbol; feeds that don't just return no quote.)
    symbols: [BTC/USD, ETH/USD, SOL/USD, PAXG/USD]
    poll_interval_sec: 2.0
    min_edge_pct: 0.3          # keep gaps LOW here too -> frequency over size
    max_edge_pct: 5.0          # above this, treat as a bad quote and skip
    fee_pct_per_leg: 0.1       # typical taker fee; raise this to match your actual exchange tier
    max_stake_per_trade_pct: 4.0   # higher than 2% so a $50 bankroll clears the ~$1 venue minimum
    max_stake_per_trade_usd: 50
    max_concurrent_positions_per_symbol: 1
    cooldown_sec: 20           # ignore re-detections of a just-traded symbol for this long

  # Polymarket crypto prediction markets vs. spot exchanges (markets/polycrypto/).
  # Two layers: "complement" (riskless: YES ask + NO ask < $1, buy both) and
  # "spot_anchor" (statistical: quote vs. a volatility model anchored to live
  # spot prices -- NOT riskless, sized with fractional Kelly).
  polymarket_crypto:
    enabled: true
    poll_interval_sec: 1.5
    market_limit: 200          # how many active markets to scan per cycle
    # The riskless YES+NO complement arb works on ANY binary market, so scan
    # them all (politics, sports, culture, crypto...) rather than crypto only
    # -- more shots at the rare riskless gap in this capacity-constrained niche.
    scan_all_markets: true
    tags: [crypto]             # only used when scan_all_markets is false
    min_liquidity_usd: 250
    max_spread_cents: 3.0      # absolute YES/NO book spread cap, in cents
    max_stake_per_trade_pct: 4.0   # higher than elsewhere so a $50 bankroll clears the ~$1 order minimum
    max_stake_per_trade_usd: 25
    max_concurrent_positions_per_market: 1
    cooldown_sec: 60
    complement:
      enabled: true
      min_edge_pct: 0.4        # locked-in return on cost, after fee buffer -- keep LOW for frequency
      max_edge_pct: 5.0        # above this, assume a bad quote and skip
      fee_buffer_pct: 0.2
    spot_anchor:
      enabled: true
      min_edge_pct: 6.0        # model-vs-quote gap in probability points; deliberately LARGE
      max_edge_pct: 30.0       # beyond this, assume the model (or quote) is broken
      min_confidence: 0.75
      max_days_to_expiry: 45   # vol assumptions degrade over long horizons
      kelly_fraction: 0.15
      annualized_vol:          # assumed vol per symbol for the pricing model
        BTC/USD: 0.55
        ETH/USD: 0.70
        SOL/USD: 0.90
      default_annualized_vol: 0.80
